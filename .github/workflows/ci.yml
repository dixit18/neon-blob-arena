name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refuse old Node (report gate — Node 20 is EOL)
        run: node --version | grep -q '^v24' || (echo 'CI must run Node 24' && exit 1)
      - run: npm ci
      - run: npm test
      - run: npm run build:server
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
