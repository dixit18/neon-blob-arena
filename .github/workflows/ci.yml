# CI gate: nothing merges that doesn't build + pass combat + survive the soak.
# Catches the "compiles here, dies there" class (see: floating-TS deploy failure).
name: CI

on:
  push:
    branches: [main]
    paths: ['neon-blob-arena/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['neon-blob-arena/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-blob-arena/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neon-blob-arena/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-blob-arena/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neon-blob-arena/client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: boot contract (S-003 gate — page must boot, buttons wired, no localhost)
        run: |
          test -f dist/index.html
          grep -q 'id="play"' dist/index.html || (echo "BOOT-CONTRACT FAIL: no #play" && exit 1)
          grep -q 'id="gamePick"' dist/index.html || (echo "BOOT-CONTRACT FAIL: no #gamePick" && exit 1)
          JS=$(grep -o 'src="[^"]*\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          test -f "dist/${JS#./}" || (echo "BOOT-CONTRACT FAIL: missing $JS" && exit 1)
          if grep -Eq 'ws://localhost|ws://127' "dist/${JS#./}"; then echo "BOOT-CONTRACT FAIL: localhost WS baked"; exit 1; fi
          echo "boot-contract OK ($JS)"

  soak:
    needs: [server]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-blob-arena/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neon-blob-arena/server/package-lock.json
      - run: npm ci
      - run: |
          PORT=7761 npx tsx src/index.ts & echo $! > srv.pid
          for i in $(seq 1 30); do curl -sf http://localhost:7761/health && break || sleep 1; done
          SERVER_URL='ws://localhost:7761?name=bot' npx tsx src/loadtest.ts --clients=30 --secs=10 --fire=0.3
          TICKAVG=$(curl -s http://localhost:7761/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["tickAvgMs"])')
          echo "tickAvgMs=$TICKAVG"
          kill "$(cat srv.pid)"
          python3 -c "import sys; sys.exit(0 if float('$TICKAVG') < 5 else 1)"
