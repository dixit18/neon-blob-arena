# Render Blueprint — all-free stage 1 ($0): Node 24 WS server (Docker) + static web.
# Push to GitHub -> Render Dashboard -> New -> Blueprint -> select repo.
# Free tier sleeps after ~15 min idle: add a free UptimeRobot ping on /health every 10 min.
services:
  - type: web
    name: playground-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - tsconfig.*.json
        - packages/**
        - apps/server/**
    envVars:
      - key: REGION
        value: iad

  - type: web
    name: playground-web
    runtime: static
    buildCommand: npm --prefix apps/web ci && npm --prefix apps/web run build
    staticPublishPath: ./apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
    envVars:
      - key: VITE_SERVER
        value: wss://playground-server.onrender.com
